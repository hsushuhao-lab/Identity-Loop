name: Li Zhou M6 targeted implementation and verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/identity-m6-targeted-patch.yml']
permissions:
  contents: write
concurrency:
  group: identity-m6-targeted-patch
  cancel-in-progress: true
jobs:
  m6-cg:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install locked dependencies
        working-directory: prototype
        run: npm ci
      - name: Reproduce missing Li Zhou M6 trigger
        working-directory: prototype
        run: |
          mkdir -p qa-results/identity-m6-cg
          if node test_identity_m6_cg_qa.js > qa-results/identity-m6-cg/baseline-red.log 2>&1; then
            echo 'Expected the unpatched M6 trigger regression to fail'; exit 1
          fi
          grep -F 'LI M6 must bind the dedicated CG' qa-results/identity-m6-cg/baseline-red.log
      - name: Apply only four verified integration edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected={
            'prototype/src/story/IdentityRouteDirector.js':'3dacae613e3b0fb08fbd70d082b89ba3ae0f0493',
            'prototype/src/story/IdentityRouteScenes.js':'b46e7152cd4381b65c87e1c2e8158237d123d673',
            'prototype/src/ui/UIManager.js':'b94e67610b9952120a7fe404b54c26a019a92f9a',
            'prototype/scripts/run-identity-qa.mjs':'fe78c1ae7940ffe4c6f7ebdd0588055018d00742'
          }
          for path,sha in expected.items():
            actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
            assert actual==sha, f'Concurrent source change: {path}: {actual}'
          def replace(path,old,new):
            p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old,s.count(old));p.write_text(s.replace(old,new))
          director='prototype/src/story/IdentityRouteDirector.js'
          replace(director,"import * as THREE from 'three';", "import * as THREE from 'three';\nimport { playIdentityM6Memory } from './IdentityM6Memories.js';")
          replace(director,'      if(beat.chenM6Cg){','      if(beat.identityM6Cg){\n        playIdentityM6Memory(this,soundManager);\n        return;\n      }\n      if(beat.chenM6Cg){')
          replace('prototype/src/story/IdentityRouteScenes.js',"{ chenM6Cg: identity==='CHEN' }", "{ chenM6Cg: identity==='CHEN', identityM6Cg: identity==='LI'||identity==='ZHOU' }")
          ui='prototype/src/ui/UIManager.js'
          p=Path(ui);p.write_text("import { drawIdentityM6Memory } from '../art/IdentityM6MemoryArt.js';\n"+p.read_text())
          replace(ui,'  renderMemoryFrame(){','  renderMemoryFrame(elapsedMs=0){')
          replace(ui,'    if(cctv){ctx.globalAlpha=.18;', '    drawIdentityM6Memory(ctx,sequence,frame,w,h,elapsedMs);\n    if(cctv){ctx.globalAlpha=.18;')
          replace('prototype/scripts/run-identity-qa.mjs',"  'test_identity_routes_qa.js',", "  'test_identity_routes_qa.js',\n  'test_identity_m6_cg_qa.js',")
          PY
          git diff --check
          git diff --stat
          git diff > prototype/qa-results/identity-m6-cg/integration.patch
      - name: Identity regressions including new CG
        working-directory: prototype
        run: npm run test:identity | tee qa-results/identity-m6-cg/structural.log
      - name: Production build
        working-directory: prototype
        run: npm run build | tee qa-results/identity-m6-cg/build.log
      - name: Install browser
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Production M6 handler and viewer desktop mobile integration
        working-directory: prototype
        run: node scripts/test-identity-m6-cg-browser.mjs qa-results/identity-m6-cg
      - name: Publish tested source blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const paths=['prototype/src/story/IdentityRouteDirector.js','prototype/src/story/IdentityRouteScenes.js','prototype/src/ui/UIManager.js','prototype/scripts/run-identity-qa.mjs'];
          const blobs=[];
          for(const path of paths){
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`,{method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({content:await readFile(path,'utf8'),encoding:'utf-8'})});
            if(!response.ok)throw Error(`${path}: ${response.status} ${await response.text()}`);
            const {sha}=await response.json();blobs.push({path,mode:'100644',type:'blob',sha});
          }
          const result={parent:process.env.GITHUB_SHA,blobs,structural:'PASS',build:'PASS',browser:'PASS'};
          console.log('TESTED_M6_SOURCE_BLOBS '+JSON.stringify(result));
          await writeFile('prototype/qa-results/identity-m6-cg/tested-source-blobs.json',JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-m6-cg-evidence
          path: prototype/qa-results/identity-m6-cg/
