name: Narrative P0 QA
on:
  push:
    branches: [narrative-fairness-p0-20260930]
permissions:
  contents: read
jobs:
  narrative-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run test:identity
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narrative-p0-build
          path: prototype/dist/
