name: Four Seed Full Opening-to-Ending QA
on:
  push:
    branches:
      - qa/four-seed-full-20261001
permissions:
  contents: read
concurrency:
  group: four-seed-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-route:
    name: ${{ matrix.identity }} opening-to-ending
    strategy:
      fail-fast: false
      matrix:
        identity: [LI, ZHANG, ZHOU, CHEN]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IDENTITY_QA_ROUTE: ${{ matrix.identity }}
      IDENTITY_QA_SKIP_CLOSURE: "1"
      IDENTITY_QA_MINIMAL_SHOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install dependencies
        working-directory: prototype
        run: npm ci
      - name: Install Chromium
        working-directory: prototype
        run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.identity }} full route against deployed main
        working-directory: prototype
        run: node scripts/test-identity-routes-browser.mjs qa-results/full-${{ matrix.identity }} https://hsushuhao-lab.github.io/Identity-Loop/
      - name: Preserve ${{ matrix.identity }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-route-${{ matrix.identity }}-evidence
          path: prototype/qa-results/full-${{ matrix.identity }}/
          retention-days: 30
